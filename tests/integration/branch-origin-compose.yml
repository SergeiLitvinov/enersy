# Real Julia HTTP -> production TypeScript parser, using the frozen wire input.
# No application database, credentials, public ports or live user data.
name: enersy-branch-origin-acceptance
services:
  worker:
    build: {context: ../.., dockerfile: backend-julia/Dockerfile}
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: [CMD, julia, --project=., --startup-file=no, -e, 'using HTTP; @assert HTTP.get("http://127.0.0.1:8001/ready"; proxy=HTTP.ProxyConfig()).status == 200']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
  contract:
    build: {context: ../.., dockerfile: frontend/Dockerfile, target: check}
    cpus: 2
    mem_limit: 2g
    environment:
      VITE_BRANCH_ORIGIN_WORKER_URL: http://worker:8001
    command: [npm, test, --, src/api/calculation-branch-origin.http.test.ts]
    depends_on:
      worker: {condition: service_healthy}
networks:
  default: {internal: true}
