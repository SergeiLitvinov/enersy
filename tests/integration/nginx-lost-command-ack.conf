# Acceptance-only fault: commit the command upstream, then hide its identity.
# Never mount this configuration into the working application.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /api/ees/connection-commands {
        proxy_pass http://go-api:8080;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter '"commandId":' '"discardedCommandId":';
        sub_filter_once off;
    }
    location /api { proxy_pass http://go-api:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
