# Disposable acceptance environment. Never uses the application database volume.
name: enersy-revision-acceptance
services:
  snapshot-profile-check:
    image: golang:1.24-alpine
    profiles: [snapshot-profile]
    networks: [default, web]
    cpus: 2
    mem_limit: 1g
    working_dir: /workspace/backend-go
    volumes:
      - ../..:/workspace:ro
      - ../../.cache:/reports
      - ../../.cache/go-mod:/go/pkg/mod
      - ../../.cache/go-build:/root/.cache/go-build
    environment:
      GOTOOLCHAIN: local
      GOMAXPROCS: 2
      TEST_DATABASE_URL: host=postgres port=5432 user=acceptance password=disposable_acceptance dbname=revision_acceptance sslmode=disable
      ENERSY_SNAPSHOT_PROFILE_OUTPUT: /reports/snapshot-profile.json
    command: ["sh", "-c", "go vet ./... && go test -run '^TestCalculationSnapshotProfilePostgres$$' -v -count=1 ./..."]
    depends_on:
      postgres:
        condition: service_healthy
  connection-command-fault:
    image: node:20-alpine
    profiles: [browser-fault]
    networks: [default, web]
    volumes:
      - ./connection-command-fault-proxy.mjs:/acceptance/fault-proxy.mjs:ro
    command: ["node", "/acceptance/fault-proxy.mjs"]
    ports:
      - "127.0.0.1:4175:3001"
    depends_on:
      go-api:
        condition: service_healthy
      react-frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/__acceptance/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
  connection-command-check:
    image: node:20-alpine
    profiles: [commands]
    volumes:
      - ./connection-command-loss.mjs:/acceptance/connection-command-loss.mjs:ro
    command: ["node", "--test", "/acceptance/connection-command-loss.mjs"]
    depends_on:
      go-api:
        condition: service_healthy
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: revision_acceptance
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: disposable_acceptance
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acceptance -d revision_acceptance"]
      interval: 2s
      timeout: 3s
      retries: 20
  go-api:
    networks: [default, web]
    build:
      context: ../..
      dockerfile: backend-go/Dockerfile
    environment:
      DB_HOST: postgres
      POSTGRES_DB: revision_acceptance
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: disposable_acceptance
      CORS_ORIGIN: http://localhost:4174
      JULIA_BASE_URL: http://julia-compute:8001
      AUTH_ORIGIN: http://localhost:4174
      AUTH_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/ready"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s
  julia-compute:
    build:
      context: ../../backend-julia
      dockerfile: Dockerfile
  react-frontend:
    networks: [default, web]
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:4174:3000"
    depends_on:
      go-api:
        condition: service_healthy
networks:
  default:
    internal: true
  web: {}
