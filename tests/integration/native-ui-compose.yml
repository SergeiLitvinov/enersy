# Combine with native-compose.yml; disposable UI on loopback only.
services:
  go-api:
    image: enersy-go-api
    environment:
      DB_HOST: postgres
      POSTGRES_DB: native_acceptance
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: disposable_acceptance
      JULIA_BASE_URL: http://worker:8001
      AUTH_ORIGIN: http://localhost:4177
      AUTH_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 3s
      retries: 20
  frontend:
    image: enersy-react-frontend
    networks: [default, web]
    ports: ["127.0.0.1:4177:3000"]
    depends_on:
      go-api:
        condition: service_healthy
networks:
  web: {}
