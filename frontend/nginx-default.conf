# Resolve service replacements without restarting this frontend container.
# Requires OSS nginx >= 1.27.3 and the Docker embedded DNS resolver.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;
upstream enersy_api {
    zone enersy_api 64k;
    server go-api:8080 resolve;
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://enersy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
