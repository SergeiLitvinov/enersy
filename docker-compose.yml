services:
  nginx:
    image: nginx:alpine@sha256:8b1e78743a03dbb2c95171cc58639fef29abc8816598e27fb910ed2e621e589a
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - go-api
      - react-frontend
    restart: unless-stopped

  postgres:
    image: postgres:15.19@sha256:baa22e6286bf832cb147b8bb5aa9d8bc999846d69c21d11bf63f58fbeed1fa48
    container_name: hybrid-db
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  go-api:
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    container_name: go-api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_DB=app_db
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=app_pass
      - CORS_ORIGIN=http://localhost:3000
      - AUTH_ORIGIN=${AUTH_ORIGIN:-}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - PORT=8080
      - JULIA_BASE_URL=${JULIA_BASE_URL:-http://julia-compute:8001}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  study-worker:
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    command: ["./server", "-study-worker"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_DB=app_db
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=app_pass
      - JULIA_BASE_URL=http://julia-compute:8001
    cpus: 1
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      go-api:
        condition: service_healthy
      julia-compute:
        condition: service_healthy
    restart: unless-stopped

  julia-compute:
    build:
      context: .
      dockerfile: backend-julia/Dockerfile
    container_name: julia-compute
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    healthcheck:
      test: ["CMD", "julia", "--project=.", "--startup-file=no", "-e", "using HTTP; @assert HTTP.get(\"http://127.0.0.1:8001/ready\"; proxy=HTTP.ProxyConfig()).status == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - postgres
    restart: unless-stopped

  julia-check:
    profiles: [julia-check]
    build:
      context: .
      dockerfile: backend-julia/Dockerfile
    network_mode: none
    cpus: 2
    mem_limit: 2g
    command: ["julia", "--project=.", "--startup-file=no", "-e", "using Pkg; @assert VERSION == v\"1.13.2\"; Pkg.offline(true); Pkg.test(;allow_reresolve=false)"]
    restart: "no"

  julia-audit:
    profiles: [julia-audit]
    build:
      context: .
      dockerfile: backend-julia/Dockerfile
    volumes:
      - ./scripts/security:/audit:ro
      - ./backend-julia/Manifest.toml:/locked/Manifest.toml:ro
    cpus: 2
    mem_limit: 2g
    command: ["julia", "--project=.", "--startup-file=no", "/audit/audit_julia.jl", "/locked/Manifest.toml"]
    restart: "no"

  notice-maintenance-check:
    profiles: [notice-maintenance-check]
    image: python:3.12.13-alpine@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
    working_dir: /workspace
    volumes:
      - ./scripts/security:/workspace/scripts/security:ro
    network_mode: none
    cpus: 1
    mem_limit: 256m
    command: ["python", "-B", "-m", "unittest", "discover", "-s", "scripts/security", "-p", "update_julia_notices_test.py", "-v"]
    restart: "no"

  react-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: react-frontend
    ports:
      - "3000:3000"
    depends_on:
      - go-api
    restart: unless-stopped

  docs:
    profiles: [docs]
    build:
      context: .
      dockerfile: docs/Dockerfile
    ports:
      - "4173:80"
    restart: unless-stopped

  numerics-check:
    profiles: [numerics-check]
    build:
      context: ./numerics
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ./numerics:/workspace:ro
    network_mode: none
    restart: "no"

  rust-wasm-check:
    profiles: [rust-wasm-check]
    build:
      context: .
      dockerfile: rust-wasm/Dockerfile
    network_mode: none
    cpus: 2
    mem_limit: 2g
    restart: "no"

  rust-msrv-check:
    profiles: [rust-msrv-check]
    build:
      context: .
      dockerfile: scripts/build/rust-msrv.Dockerfile
    network_mode: none
    cpus: 2
    mem_limit: 2g
    restart: "no"

  rust-audit:
    profiles: [rust-audit]
    build:
      context: ./numerics
      dockerfile: audit.Dockerfile
    volumes:
      - ./numerics/Cargo.lock:/locks/numerics.lock:ro
      - ./rust-wasm/Cargo.lock:/locks/wasm.lock:ro
    cpus: 2
    mem_limit: 2g
    restart: "no"

  julia-rust-compute:
    profiles: [native-compute]
    build:
      context: .
      dockerfile: numerics/ffi.Dockerfile
    command: ["julia", "--project=.", "--startup-file=no", "experimental/native_server.jl"]
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "julia", "--project=.", "--startup-file=no", "-e", "using HTTP; @assert HTTP.get(\"http://127.0.0.1:8001/ready\"; proxy=HTTP.ProxyConfig()).status == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  numerics-ffi-check:
    profiles: [numerics-ffi-check]
    build:
      context: .
      dockerfile: numerics/ffi.Dockerfile
    network_mode: none
    cpus: 2
    mem_limit: 2g
    restart: "no"

volumes:
  postgres_data: {}
